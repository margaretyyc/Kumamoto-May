<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat Beyond Words - 橫式大圖 KV 區塊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LineSeedJP:wght@700;900&family=Noto+Sans+TC:wght@500;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 鎖定 1600px x 550px 的實體大圖 160x55 cm 比例 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'LineSeedJP', 'Noto Sans JP', 'Noto Sans TC', sans-serif;
            background-color: #FFDE00; /* 鮮黃外圍背景，完美對接您的 Canva 底色 */
            width: 1600px;
            height: 550px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 核心主視覺：完全比照原版色彩「紅 -> 粉紅橙 -> 淺紫」的明亮柔和漸層 */
        .kv-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #E60012 0%, #F16522 50%, #B28BC2 100%);
            border: 8px solid #000;
            border-radius: 40px;
            padding: 50px 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* 上半部：純文字的 BEAT BEYOND WORDS (無黑色膠囊底塊) */
        .tag-text {
            color: #FFF;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        /* 中間：中日雙語雙色副標題 */
        .slogan-group {
            margin-top: 20px;
        }
        .sub-slogan-ja {
            color: #FFF;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .sub-slogan-zh {
            color: #FFDE00;
            font-size: 26px;
            font-weight: 700;
            font-style: italic;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* 下半部：最震撼、放大不糊的「ドンドコ、熊本。」核心大字 */
        .main-title {
            color: #FFF;
            font-size: 105px; /* 依照原版大圖比例加大字體 */
            font-weight: 900;
            text-shadow: 5px 5px 0px #000;
            margin-top: auto;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="kv-container">
        
        <div class="tag-text">BEAT BEYOND WORDS</div>
        
        <div class="slogan-group">
            <div class="sub-slogan-ja">言葉より、早くつながる。</div>
            <div class="sub-slogan-zh">跨越語言，用節奏交朋友。</div>
        </div>
        
        <div class="main-title">ドンドコ、熊本。</div>
        
    </div>

</body>
</html>
