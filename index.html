<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat Beyond Words - 橫式大圖 KV 區塊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LineSeedJP:wght@700;900&family=Noto+Sans+TC:wght@500;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 鎖定 1600px x 550px 的實體大圖 160x55 cm 比例 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'LineSeedJP', 'Noto Sans JP', 'Noto Sans TC', sans-serif;
            background-color: #FFDE00; /* 鮮黃外圍背景，完美對接您的 Canva 底色 */
            width: 1600px;
            height: 550px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 核心主視覺：紅紫漸層大圓角色塊，加上外圍霓虹紫光與黑粗框 */
        .kv-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #E60012 0%, #920783 50%, #4A0099 100%);
            border: 8px solid #000;
            border-radius: 40px;
            box-shadow: 0 0 30px rgba(146, 7, 131, 0.8); /* 邊緣霓虹紫光 */
            padding: 45px 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* 上半部：音波圖標與 BEAT BEYOND WORDS 膠囊標籤 */
        .kv-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .sound-wave {
            display: flex;
            gap: 5px;
        }
        .sound-wave div {
            width: 6px;
            background-color: #FFF;
            border-radius: 3px;
        }
        .sound-wave div:nth-child(1) { height: 25px; }
        .sound-wave div:nth-child(2) { height: 40px; }
        .sound-wave div:nth-child(3) { height: 18px; }
        
        .tag-pill {
            background-color: rgba(0,0,0,0.4);
            color: #FFF;
            padding: 8px 22px;
            border-radius: 25px;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        /* 中間：中日雙語雙色副標題 */
        .slogan-group {
            margin-top: 20px;
        }
        .sub-slogan-ja {
            color: #FFF;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .sub-slogan-zh {
            color: #FFDE00;
            font-size: 28px;
            font-weight: 700;
            font-style: italic;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        /* 下半部：最震撼、放大不糊的「ドンドコ、熊本。」核心大字 */
        .main-title {
            color: #FFF;
            font-size: 96px; /* 加大字體，在寬螢幕下視覺張力極強 */
            font-weight: 900;
            text-shadow: 5px 5px 0px #000;
            margin-top: auto;
            letter-spacing: 3px;
        }

        /* 裝飾元件 1：右上角漂浮的音符組 */
        .notes-deco {
            position: absolute;
            right: 180px;
            top: 45px;
            font-size: 55px;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 3px 3px 0px #000;
            line-height: 1.2;
            pointer-events: none;
        }

        /* 裝飾元件 2：最右上角的可愛迷你太鼓 */
        .drum-deco {
            position: absolute;
            right: 45px;
            top: 40px;
            width: 110px;
            height: 110px;
            object-fit: contain;
            transform: rotate(15deg);
            filter: drop-shadow(4px 4px 0px #000);
        }
    </style>
</head>
<body>

    <div class="kv-container">
        
        <div class="kv-header">
            <div class="sound-wave">
                <div></div><div></div><div></div>
            </div>
            <div class="tag-pill">BEAT BEYOND WORDS</div>
        </div>
        
        <div class="slogan-group">
            <div class="sub-slogan-ja">言葉より、早くつながる。</div>
            <div class="sub-slogan-zh">跨越語言，用節奏交朋友。</div>
        </div>
        
        <div class="main-title">ドンドコ、熊本。</div>

        <div class="notes-deco">♫ ♬ ♩</div>

        <img class="drum-deco" src="drum.png" alt="鼓" onerror="this.src='https://img.icons8.com/emoji/96/drum-emoji.png'">
        
    </div>

</body>
</html>
