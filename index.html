<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat Beyond Words - 橫式大圖 KV 區塊 (精準還原版)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LineSeedJP:wght@900&family=Noto+Sans+JP:wght@500;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 鎖定 1600px x 550px 的實體大圖 160x55 cm 比例 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'LineSeedJP', 'Noto Sans JP', 'Noto Sans TC', sans-serif;
            background-color: #FFDE00; /* 鮮黃外圍背景，完美對接您的 Canva 底色 */
            width: 1600px;
            height: 550px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 核心主視覺：100% 複製原版明亮、帶有發光感的「紅 -> 螢光橘粉 -> 淺紫」漸層 */
        .kv-container {
            width: 100%;
            height: 100%;
            /* 調整漸層錨點，讓明亮的橘紅色域大面積展開，避免紫色過多導致變深變暗 */
            background: linear-gradient(105deg, #FF0000 0%, #FF5500 35%, #FF007F 70%, #944BB2 100%);
            border: 8px solid #000;
            border-radius: 40px;
            padding: 55px 70px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* 頂部區域：膠囊背景 + 音波橫向排列 */
        .kv-header {
            display: flex;
            align-items: center;
            align-self: flex-start; 
            background-color: rgba(0, 0, 0, 0.55); /* 黑色膠囊背景塊 */
            padding: 10px 24px;
            border-radius: 25px;
            gap: 15px;
        }

        /* 左側白色音波 Sound Bar */
        .sound-wave {
            display: flex;
            gap: 5px;
            align-items: flex-end;
        }
        .sound-wave div {
            width: 5px;
            background-color: #FFF;
            border-radius: 3px;
        }
        .sound-wave div:nth-child(1) { height: 18px; }
        .sound-wave div:nth-child(2) { height: 32px; }
        .sound-wave div:nth-child(3) { height: 14px; }
        
        /* 膠囊內的純白文字 */
        .tag-text {
            color: #FFF;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        /* 中間：中日雙語宣傳副標 */
        .slogan-group {
            margin-top: 15px;
        }
        /* 日文副標題維持手寫圓體感 */
        .sub-slogan-ja {
            color: #FFF;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 42px; 
            font-weight: 500;
            letter-spacing: 1.5px;
        }
        /* 中文副標題：黃色斜體 */
        .sub-slogan-zh {
            color: #FFDE00;
            font-size: 28px;
            font-weight: 700;
            font-style: italic;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* 下半部：徹底加大、具有絕對黑邊與陰影的 Sharp 字體 */
        .main-title {
            color: #FFF;
            font-family: 'LineSeedJP', 'Noto Sans JP', sans-serif;
            font-size: 145px; /* 再次放大體積，完美還原滿版比例 */
            font-weight: 900;
            letter-spacing: 4px;
            margin-top: auto;
            white-space: nowrap;
            /* 強制邊緣銳利化（SHARP）的黑色描邊與經典立體陰影 */
            -webkit-text-stroke: 4px #000;
            text-shadow: 
                -4px -4px 0 #000,  
                 4px -4px 0 #000,
                -4px  4px 0 #000,
                 4px  4px 0 #000,
                 8px  8px 0px #000; /* 重磅日式實心黑影 */
        }
    </style>
</head>
<body>

    <div class="kv-container">
        
        <div class="kv-header">
            <div class="sound-wave">
                <div></div><div></div><div></div>
            </div>
            <div class="tag-text">BEAT BEYOND WORDS</div>
        </div>
        
        <div class="slogan-group">
            <div class="sub-slogan-ja">言葉より、早くつながる。</div>
            <div class="sub-slogan-zh">跨越語言，用節奏交朋友。</div>
        </div>
        
        <div class="main-title">ドンドコ、熊本。</div>
        
    </div>

</body>
</html>
